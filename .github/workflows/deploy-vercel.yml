name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@39.1.3

      - name: Pull Vercel production environment
        # Uses project/org IDs from GitHub Secrets, without storing them in the repo.
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project
        # If the build fails, this step fails and the deployment is not executed.
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt project
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_OUTPUT="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "$DEPLOY_OUTPUT"

          DEPLOY_URL="$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+' | tail -n 1 || true)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "Could not determine the deployment URL from Vercel CLI output."
            exit 1
          fi

          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deploy URL: $DEPLOY_URL"

      - name: Deployment summary
        run: echo "Production deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
